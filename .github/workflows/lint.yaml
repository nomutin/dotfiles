name: Lint

on:
  pull_request:
    branches:
      - master

jobs:
  shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run ShellCheck
        uses: reviewdog/action-shellcheck@5ebd09ddbe2ebb471646ce234c6c8dd18663ca7c # v1.30.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          pattern: "*.sh"
          exclude: "./.git/*"

  lua:
    name: Lint Lua Files
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck
      - name: Run luacheck
        run: luacheck --config .config/nvim/.luacheckrc .config/

  markdown:
    name: Lint Markdown Files
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run markdownlint
        run: npx markdownlint-cli@0.44.0 "**/*.md" --ignore node_modules

  vimscript:
    name: Lint vimscript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run Vint
        uses: ludvighz/vint-action@31fa19d060969bb48fcfd9044773d665bf03e8c3 # v1
        with:
          path: .config/vim/vimrc

  github-actions:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  toml:
    name: Lint TOML Files
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run taplo
        run: find . -name '*.toml' -not -path './.git/*' -print0 | xargs -0 npx @taplo/cli@0.7.0 fmt --check

  tmux:
    name: Lint tmux config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Validate config
        run: tmux -f .config/tmux/tmux.conf new-session -d
