[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
env_shell_expand = true
idiomatic_version_file_enable_tools = []
experimental = true

[dotfiles]
"~/.config/**" = {}
"~/.bashrc/activate" = { block = 'eval "$(~/.local/bin/mise activate bash)"' }       # non-login shell
"~/.bash_profile/activate" = { block = 'eval "$(~/.local/bin/mise activate bash)"' } # login shell

[env]
PS1 = '\[\e[32m\]\u \[\e[$([ $? -ne 0 ] && echo 31 || echo 0)m\]➜ \[\e[34m\]\w \[\e[0m\]\$ '
HISTSIZE = 10000
HISTFILESIZE = 20000
XDG_CONFIG_HOME = "${HOME}/.config"
XDG_DATA_HOME = "${HOME}/.local/share"
XDG_CACHE_HOME = "${HOME}/.cache"
XDG_STATE_HOME = "${HOME}/.local/state"

AWS_CONFIG_FILE = "${XDG_CONFIG_HOME}/aws/config"
AWS_SHARED_CREDENTIALS_FILE = "${XDG_CONFIG_HOME}/aws/credentials"
DOCKER_CONFIG = "${XDG_CONFIG_HOME}/docker"
DOTNET_CLI_HOME = "${XDG_DATA_HOME}/dotnet"
HISTFILE = "${XDG_STATE_HOME}/bash/history"
NPM_CONFIG_USERCONFIG = "${XDG_CONFIG_HOME}/npm/npmrc"
LESSHISTFILE = "${XDG_STATE_HOME}/less/history"
PI_CONFIG_DIR = "${XDG_CONFIG_HOME}/pi"
PI_CODING_AGENT_DIR = "${XDG_DATA_HOME}/pi/agent"
VIMINIT = 'source ${XDG_CONFIG_HOME}/vim/vimrc'

[shell_alias]
ls = "ls --color=auto"
ll = "ls -la"
dd = "du -sch $(ls -A)"

[hooks]
enter = ["shopt -s checkwinsize", 'mkdir -p "${XDG_STATE_HOME}"/bash']

[tools]
aws = "latest"
"npm:bash-language-server" = { version = "latest", depends = ["bun"] }
bun = "latest"
github-cli = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
"llama.cpp" = { version = "latest", version_prefix = "b", os = ["macos"] }
lua-language-server = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tmux = "latest"
tombi = "latest"
ripgrep = "latest"
ty = "latest"
uv = "latest"
"npm:vscode-langservers-extracted" = { version = "latest", depends = ["bun"] }
"npm:@vtsls/language-server" = { version = "latest", depends = ["bun"] }
"aqua:ouch-org/ouch" = { version = "latest", os = ["macos"] }
pi = "latest"
"npm:yaml-language-server" = { version = "latest", depends = ["bun"] }

[settings.npm]
package_manager = "bun"

[bootstrap.user]
login_shell = "/bin/bash"

[bootstrap.hooks.pre-defaults]
run = """
scutil --set ComputerName MBA
scutil --set HostName MBA
scutil --set LocalHostName MBA
hidutil property --set '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc": 0x700000039, "HIDKeyboardModifierMappingDst": 0x7000000E0}]}'
"""

[bootstrap.packages]
"brew:container" = "latest"
"brew-cask:ghostty" = "latest"
"brew:mole" = "latest"
"brew-cask:stats" = "latest"

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0.0
autohide_time_modifier = 0.0
tilesize = 128
orientation = "bottom"
show_recents = false
apps = [
  "/System/Cryptexes/App/System/Applications/Safari.app",
  "/System/Applications/Mail.app",
  "/System/Applications/Calendar.app",
  "/Applications/Ghostty.app",
]

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 10

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults."com.apple.dock"]
static-only = false
expose-group-apps = false
wvous-bl-corner = 10
wvous-br-corner = 5

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllExtensions = true
ShowExternalHardDrivesOnDesktop = false
ShowHardDrivesOnDesktop = false
ShowMountedServersOnDesktop = false
SidebarTagsSctionDisclosedState = true
ShowRecentTags = false
FXEnableExtensionChangeWarning = false
NewWindowTarget = "PfHm"
FXDefaultSearchScope = "SCcf"
FXCalculateAllSizes = false

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
FlashDateSeparators = false
Show24Hour = true
ShowAMPM = true
ShowDate = true
ShowDayOfWeek = true
ShowSeconds = true

[bootstrap.macos.defaults."com.apple.screencapture"]
type = "jpg"

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableStandardClickToShowDesktop = false

[bootstrap.macos.defaults."com.apple.controlcenter"]
"NSStatusItem VisibleCC Bluetooth" = 1

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadThreeFingerDrag = false
Clicking = true
TrackpadTrackingSpeed = 3.0

[bootstrap.macos.defaults.NSGlobalDomain]
trackpad = 3.0
mouse = 3.0
AppleInterfaceStyle = "Dark"

[bootstrap.hooks.post-defaults]
run = "killall Finder || killall Dock || true"
